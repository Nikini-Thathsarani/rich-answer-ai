<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rich Answer AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>📘 Rich Answer AI</h1>

            <p>
                AI Assistant for Technical Manuals
            </p>
        </header>


        <!-- PDF Upload -->

        <section class="upload-section">

            <h2>📄 Upload Technical Manual</h2>

            <input
                type="file"
                id="pdfFile"
                accept=".pdf"
            >

            <button id="uploadBtn">
                Upload PDF
            </button>

            <div id="uploadStatus"></div>

        </section>


        <!-- Chat -->

        <section class="chat-box">

            <div id="messages">

                <div class="bot-message">

                    Hello! 👋

                    <br><br>

                    Upload a technical manual and ask me a question.

                </div>

            </div>


            <div class="input-area">

                <input
                    type="text"
                    id="question"
                    placeholder="Ask a question about the manual..."
                >

                <button id="sendBtn">
                    Send
                </button>

            </div>

        </section>

    </div>


    <script src="script.js"></script>

</body>

</html>
