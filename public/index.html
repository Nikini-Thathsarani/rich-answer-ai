<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rich Answer AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>📘 Rich Answer AI</h1>

        <p>AI Assistant for Technical Manuals</p>

        <div class="chat-box">

            <div id="messages">
                <div class="bot-message">
                    Hello! 👋 Upload a technical manual and ask me a question.
                </div>
            </div>

            <div class="input-area">

                <input
                    type="text"
                    id="question"
                    placeholder="Ask a question..."
                >

                <button>
                    Send
                </button>

            </div>

        </div>

    </div>

</body>

</html>
